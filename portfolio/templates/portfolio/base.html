<!DOCTYPE html>
{% load static vite %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Phil Benson{% endblock %}</title>
    <meta name="description" content="Senior software engineer working on back-end and full-stack web applications, remotely from Philadelphia.">
    <link rel="canonical" href="https://philbenson.name/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://philbenson.name/">
    <meta property="og:title" content="Phil Benson">
    <meta property="og:description" content="Senior software engineer working on back-end and full-stack web applications, remotely from Philadelphia.">
    <meta property="og:image" content="https://philbenson.name{% static 'img/social-card.png' %}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Phil Benson, Senior Software Engineer, Back-End and Full-Stack">
    <meta name="twitter:card" content="summary_large_image">
    <script>
        {
            const theme = new URLSearchParams(location.search).get("theme");
            if (theme === "light" || theme === "dark") document.documentElement.classList.add(theme);
        }
    </script>
    <link rel="icon" href="{% static 'favicon.ico' %}" sizes="any">
    <link rel="icon" type="image/png" href="{% static 'favicon-32x32.png' %}" sizes="32x32">
    <link rel="icon" type="image/png" href="{% static 'favicon-16x16.png' %}" sizes="16x16">
    {% vite %}
    {% vite 'css/tailwind.css' %}
</head>
<body class="bg-white dark:bg-black font-light text-black dark:text-grey text-xl sm:text-2xl px-4 sm:px-8 py-8">
    <main class="mx-auto max-w-3xl">
{% block content %}{% endblock %}
    </main>
</body>
</html>
